<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Halloween AR Face Mask</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    a-scene { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <a-scene mindar-face="faceOccluder: false" embedded vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-entity id="face" mindar-face-default-face-occluder></a-entity>
    <a-camera active="false" position="0 0 0"></a-camera>
  </a-scene>

  <script>
    // ===== ตัวปรับตำแหน่งหน้ากาก (แก้ตรงนี้ถ้าตา/ปากเพี้ยน) =====
    const SCALE_Y  = 1.0;  // ยืด/หดแนวตั้ง (มากกว่า 1 = ลายเล็กลงในแนวตั้ง)
    const OFFSET_Y = 0.0;  // ขยับขึ้นลง (ค่าบวก = ลายเลื่อนลง, ค่าลบ = เลื่อนขึ้น)
    const SCALE_X  = 1.0;  // ยืด/หดแนวนอน
    // ==========================================================

    document.querySelector('a-scene').addEventListener('arReady', () => {
      const THREE = AFRAME.THREE;

      // ภาพหน้ากากฮาโลวีนจาก Canva (วางไว้ที่โฟลเดอร์หลักของ repo)
      const texture = new THREE.TextureLoader().load('Halloween_.png');
      texture.colorSpace = THREE.SRGBColorSpace;

      // ปรับตำแหน่ง/ขนาดของลายบนใบหน้า
      texture.wrapS = THREE.ClampToEdgeWrapping;
      texture.wrapT = THREE.ClampToEdgeWrapping;
      texture.repeat.set(SCALE_X, SCALE_Y);
      texture.offset.set((1 - SCALE_X) / 2, (1 - SCALE_Y) / 2 - OFFSET_Y);

      // ใช้ face mesh ของ MindAR แล้วเปลี่ยนจากวัสดุบังหน้าเป็น texture
      const mesh = document.querySelector('#face').getObject3D('mesh');
      mesh.material.dispose();
      mesh.material = new THREE.MeshBasicMaterial({
        map: texture, transparent: true, opacity: 1, side: THREE.DoubleSide
      });
      mesh.frustumCulled = false;
    });
  </script>
</body>
</html>
