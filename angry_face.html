<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Angry Face Filter</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    a-scene { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <a-scene mindar-face="faceOccluder: false" embedded color-space="sRGB"
           renderer="colorManagement: true, physicallyCorrectLights: true"
           vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

    <a-assets timeout="30000">
      <!-- โมเดล angry.glb (วางไว้ที่โฟลเดอร์หลักของ repo) -->
      <a-asset-item id="angryModel" src="angry.glb"></a-asset-item>
    </a-assets>

    <a-camera active="false" position="0 0 0"></a-camera>

    <!-- แสง ให้โมเดลมองเห็นสีชัด -->
    <a-light type="ambient" intensity="1.2"></a-light>
    <a-light type="directional" intensity="1.5" position="0 1 2"></a-light>

    <!-- จุดอ้างอิงขอบหน้าซ้าย-ขวา เอาไว้วัดความกว้างหน้าเพื่อปรับขนาดโมเดลอัตโนมัติ -->
    <a-entity id="anchorL" mindar-face-target="anchorIndex: 234"></a-entity>
    <a-entity id="anchorR" mindar-face-target="anchorIndex: 454"></a-entity>

    <!-- จุดยึดระหว่างตา (168) -->
    <a-entity mindar-face-target="anchorIndex: 168">
      <a-entity id="pivot" fit-to-face visible="false">
        <a-gltf-model src="#angryModel"></a-gltf-model>
      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    // ===== ตัวปรับโมเดล (แก้ตรงนี้ถ้าโมเดลเล็ก/ใหญ่/เลื่อนไม่พอดี) =====
    const SIZE_MULTIPLIER = 1.0;  // ขนาดโมเดลเทียบกับความกว้างหน้า (เพิ่ม = ใหญ่ขึ้น, ลด = เล็กลง)
    const OFFSET_Y = 0.0;         // เลื่อนขึ้นลง (หน่วยเป็นสัดส่วนของขนาดโมเดล, ค่าบวก = ขึ้น)
    const OFFSET_Z = 0.0;         // เลื่อนเข้าออก (ค่าบวก = ยื่นมาข้างหน้า, ค่าลบ = ถอยเข้าหาหัว)
    // ===========================================================

    // ตำแหน่งในโมเดลเอง: ตาอยู่สูงจากกึ่งกลางประมาณ +0.1 และหน้าอยู่ที่ z = +0.5
    const MODEL_EYE_Y = 0.1;
    const MODEL_FRONT_Z = 0.5;

    AFRAME.registerComponent('fit-to-face', {
      init() {
        const THREE = AFRAME.THREE;
        this.a = new THREE.Vector3();
        this.b = new THREE.Vector3();
        this.size = 0;
      },
      tick() {
        const L = document.querySelector('#anchorL').object3D;
        const R = document.querySelector('#anchorR').object3D;
        L.getWorldPosition(this.a);
        R.getWorldPosition(this.b);
        // แปลงเป็นหน่วยของ "จุดยึดแม่" (anchor 168) ซึ่งมีสเกลของใบหน้าอยู่แล้ว
        // ไม่งั้นโมเดลจะถูกขยายซ้ำสองรอบจนใหญ่เต็มจอ
        const parent = this.el.object3D.parent;
        parent.updateWorldMatrix(true, false);
        parent.worldToLocal(this.a);
        parent.worldToLocal(this.b);
        const faceWidth = this.a.distanceTo(this.b);
        if (!(faceWidth > 0.0001)) return;

        const target = faceWidth * SIZE_MULTIPLIER;
        // ทำให้ขนาดนิ่ง ไม่สั่น
        this.size = this.size ? this.size + (target - this.size) * 0.15 : target;

        const s = this.size;
        const o = this.el.object3D;
        o.scale.set(s, s, s);
        // วางให้ตาของโมเดลตรงกับจุดระหว่างตา และหน้าโมเดลอยู่ที่ผิวหน้า
        o.position.set(0, (OFFSET_Y - MODEL_EYE_Y) * s, (OFFSET_Z - MODEL_FRONT_Z) * s);
        o.visible = true;
      }
    });
  </script>
</body>
</html>
